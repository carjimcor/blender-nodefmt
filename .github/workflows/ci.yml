name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.1
      - run: ruff check --output-format=github .

  layout:
    name: layouts unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # the layout core is pure Python: it sorts the examples (dumped by tools/dump_examples.py)
      # without Blender and compares every result with the saved one
      - run: python -I tools/bench.py tests/layout/trees --runs 1 --compare tests/layout/baseline.json
